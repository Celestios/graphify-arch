[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graphify-arch"
version = "0.1.0"
description = "Architecture enforcement plugin for graphify"
dependencies = [
    "networkx",
    "blake3",
    "watchdog",
    "numpy",
    "onnxruntime",
    "tokenizers",
    "tree-sitter",
    "tree-sitter-rust"
]

[project.entry-points."graphify.plugins"]
arch = "plugin:ArchPlugin"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["plugin", "plugins", "scaffolder", "propagator", "auditor", "embedder", "main", "cli", "compiler", "db", "project", "schema", "parser"]
