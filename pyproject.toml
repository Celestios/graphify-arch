[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graphify-arch"
version = "0.1.12"
description = "Architecture enforcement plugin for graphify"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["graphify", "architecture", "code-analysis", "dependency-graph", "enforcement"]
dependencies = [
    "networkx>=3.4",
    "numpy>=1.21",
    "onnxruntime",
    "tokenizers",
]

[project.urls]
Homepage = "https://github.com/Celestios/graphify-arch"
Repository = "https://github.com/Celestios/graphify-arch"

[project.entry-points."graphify.plugins"]
arch = "plugin:ArchPlugin"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["plugin", "plugin_helpers", "plugins", "propagator", "auditor", "embedder", "main", "cli", "compiler", "db", "project", "schema", "utils"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["references*"]

[tool.setuptools.package-data]
references = ["*.md"]
