[package]
name = "arch_indexer"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
blake3 = "1.5"
tree-sitter = "0.24"
tree-sitter-rust = "0.23"
tree-sitter-dart = "0.2"
rusqlite = { version = "0.33.0", features = ["bundled"] }
petgraph = "0.8.3"
streaming-iterator = "0.1"
